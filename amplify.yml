version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - node --version
        - npm ci --cache .npm --prefer-offline
        - |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "ERROR: VITE_API_BASE_URL is not set in Amplify environment variables."
            exit 1
          fi
          echo "Building with VITE_API_BASE_URL=$VITE_API_BASE_URL"
    build:
      commands:
        - npm run build
        - test -f dist/index.html
        - grep -q 'id="root"' dist/index.html
        - |
          if grep -q 'tsr-stream-barrier' dist/index.html; then
            echo "ERROR: dist/index.html still contains TanStack Start SSR output."
            exit 1
          fi
        - |
          if grep -rq '16.170.226.208' dist/; then
            echo "ERROR: Build still contains the old EC2 IP. Redeploy after fixing VITE_API_BASE_URL."
            exit 1
          fi
        - |
          if ! grep -rq 'api.stsofficial.online' dist/assets/; then
            echo "ERROR: Expected production API URL was not baked into dist/assets."
            exit 1
          fi
        - echo "SPA build OK — static index.html with correct API URL"
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - .npm/**/*
  customRedirects:
    - source: "/<*>"
      target: "/index.html"
      status: "404-200"
